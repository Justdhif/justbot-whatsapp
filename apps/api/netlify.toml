[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "functions"
  # Gunakan nft (Node File Tracing) bukan esbuild.
  # nft menelusuri semua dependency (termasuk dist/) dan mengemas semuanya
  # ke dalam Lambda package, sehingga '../dist/lambda' selalu tersedia.
  node_bundler = "nft"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true
